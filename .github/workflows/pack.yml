name: Build AfterHours

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify downloads and build the pack
        run: python3 scripts/build.py --verify-downloads
      - name: Read validated pack version
        id: version
        run: echo "tag=v$(jq -r .versionId pack/modrinth.index.json)" >> "$GITHUB_OUTPUT"
      - name: Check the release version before merging to main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          [[ "$TAG" =~ -(alpha|beta|rc)\.[0-9]+$ ]] || { echo "Expected a prerelease version"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" |
            jq -e --arg ref "refs/tags/$TAG" 'all(.[]; .ref != $ref)' ||
            { echo "Cannot confirm that $TAG is available"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AfterHours
          path: dist/AfterHours-*
          if-no-files-found: error
          retention-days: 7

  prerelease:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency: afterhours-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: AfterHours
          path: dist
      - name: Tag the merged commit and publish a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        working-directory: dist
        run: |
          [[ "$TAG" =~ -(alpha|beta|rc)\.[0-9]+$ ]] || { echo "Expected a prerelease version"; exit 1; }
          sha256sum --check -- *.sha256
          ref=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG" | jq -r --arg ref "refs/tags/$TAG" '.[] | select(.ref == $ref) | .ref')
          if [[ -n "$ref" ]]; then
            [[ "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" == "$GITHUB_SHA" ]] || {
              echo "Version $TAG was already tagged on a different commit. Bump the pack version."
              exit 1
            }
          fi
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            if [[ "$draft" == false ]]; then
              mkdir published
              gh release download "$TAG" --dir published
              (cd published && sha256sum --check "../AfterHours-${TAG#v}.mrpack.sha256")
              exit 0
            fi
          else
            gh release create "$TAG" --draft --prerelease --target "$GITHUB_SHA" --generate-notes --title "AfterHours ${TAG#v}"
          fi
          gh release upload "$TAG" --clobber -- *.mrpack *.sha256
          gh release edit "$TAG" --draft=false --prerelease --target "$GITHUB_SHA"
      - name: Open the back-merge PR
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          [[ "$(gh api user --jq .login)" == kyaulabs-bot ]]
          if [[ "$(gh api "repos/$GH_REPO/compare/develop...main" --jq .ahead_by)" == 0 ]]; then exit 0; fi
          if [[ -n "$(gh pr list --base develop --head main --state open --json number --jq '.[].number')" ]]; then exit 0; fi
          python3 - <<'PY' > "$RUNNER_TEMP/backmerge.md"
          import os
          from pathlib import Path
          body = Path(".github/PULL_REQUEST_TEMPLATE.md").read_text()
          for marker, text in {
              "summary": f"Bring the published {os.environ['TAG']} release history from main into develop.",
              "changes": "Merge the release commit and its already-reviewed pack changes.",
              "verification": "The release build fetched and verified all pinned downloads and published the checksummed archive.",
              "test-plan": "- [x] Verify the merged main build and release checksum.\n- [x] Confirm main contains commits missing from develop.",
          }.items():
              body = body.replace(f"<!-- {marker} -->", text)
          print(body)
          PY
          gh pr create --base develop --head main --title "chore(release): back-merge $TAG into develop" --body-file "$RUNNER_TEMP/backmerge.md"
