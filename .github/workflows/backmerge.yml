name: Merge approved back-merge

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  merge:
    if: >-
      github.event.review.state == 'approved' && github.event.review.user.login == 'kyau' &&
      github.event.pull_request.user.login == 'kyaulabs-bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'main' && github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test the proposed merge
        run: python3 scripts/build.py --verify-downloads
      - name: Merge the reviewed main commit into develop
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.review.commit_id }}
        run: |
          [[ "$(gh api user --jq .login)" == kyaulabs-bot ]]
          gh pr merge "$PR" --merge --match-head-commit "$HEAD"
